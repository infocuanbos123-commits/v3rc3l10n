<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="metroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f77e0b" />
      <stop offset="50%" stop-color="#ff9100" />
      <stop offset="100%" stop-color="#ff3d00" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f77e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Metro Lines / Film Strip Pattern Accents -->
  <path d="M16 28 L84 28" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M16 72 L84 72" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Metro Monogram 'M' intertwined with Film & Play Triangle -->
  <g filter="url(#glow)">
    <!-- Left Pillar of M -->
    <path d="M24 68 L24 32 Q24 28 28 28 L32 28 Q36 28 36 32 L36 56 L47 40 Q49 37 52 37 L54 37 Q57 37 59 40 L70 56 L70 32 Q70 28 74 28 L78 28 Q82 28 82 32 L82 68 Q82 72 78 72 L74 72 Q70 72 70 68 L70 50 L57 68 Q55 71 52 71 L50 71 Q47 71 45 68 L32 50 L32 68 Q32 72 28 72 L24 72 Q20 72 24 68 Z" fill="url(#metroGrad)" />

    <!-- Center Cinema Play Triangle Symbol -->
    <polygon points="46,47 62,56 46,65" fill="#18181b" opacity="0.9" />
    <polygon points="47,49 59,56 47,63" fill="#ffffff" />
  </g>

  <!-- Cyan Metro Track Dot Accent -->
  <circle cx="53" cy="22" r="3.5" fill="url(#neonGlow)" />
</svg>
